<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Zero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column styled as a civil-defence alert terminal. HUD on top, story and choices below. Single committed dark look. */
:root {
  --ground: #0f110d;
  --panel: #171a14;
  --line: #2f3527;
  --bone: #ebe8d8;
  --dim: #a3a691;
  --signal: #e8c547;
  --alarm: #e5533d;
  --ok: #8fbf7a;
  --f-display: "Chakra Petch", "IBM Plex Sans Thai", sans-serif;
  --f-body: "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--ground);
  color: var(--bone);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.75;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app {
  max-width: 600px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
.stripe {
  height: 8px;
  background: repeating-linear-gradient(-45deg, var(--signal) 0 10px, #0f110d 10px 20px);
}
.bar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
}
.bar b { color: var(--signal); font-weight: 500; }

/* HUD */
.hud { padding-block: 16px 4px; display: grid; gap: 14px; }
.odds { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.odds .lbl { font-size: 13px; color: var(--dim); letter-spacing: .04em; }
.odds .big { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--signal); }
.odds .big small { font-size: 15px; font-weight: 500; color: var(--bone); margin-right: 6px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.meter { min-width: 0; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 1.3; color: var(--dim); }
.meter .row .mono { color: var(--bone); font-size: 12px; }
.track { height: 6px; background: #23271d; margin-top: 6px; position: relative; overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ok); transition: width .6s ease, background-color .4s; }
.fill.warn { background: var(--signal); }
.fill.bad { background: var(--alarm); }
.fill.neutral { background: var(--bone); }

/* Story */
main { padding-top: 22px; }
.when { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13px; color: var(--dim); }
.when .mono { color: var(--signal); font-size: 14px; letter-spacing: .06em; }
.story { margin-top: 12px; }
.story p { margin: 0 0 14px; max-width: 62ch; }
.story .alert-tag {
  display: inline-block; font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  background: var(--alarm); color: #fff; padding: 1px 8px; margin-right: 8px; line-height: 1.6; vertical-align: 1px;
}
.picked { margin: 16px 0 6px; padding-left: 12px; border-left: 3px solid var(--signal); color: var(--dim); font-size: 15px; line-height: 1.6; }

.timer { margin: 18px 0 10px; display: flex; align-items: center; gap: 12px; }
.timer .tt { flex: 1; height: 6px; background: #23271d; position: relative; }
.timer .tf { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--alarm); }
.timer .tl { font-family: var(--f-mono); font-size: 14px; color: var(--alarm); min-width: 3.4ch; text-align: right; }

.choices { display: grid; gap: 10px; margin-top: 16px; }
.timer + .choices { margin-top: 0; }
.choice {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left;
  background: var(--panel); color: var(--bone); border: 1px solid var(--line); border-radius: 2px;
  padding: 13px 14px; font: inherit; font-size: 16px; line-height: 1.55; cursor: pointer; min-height: 52px; width: 100%;
}
.choice .key { font-family: var(--f-mono); font-size: 13px; color: var(--ground); background: var(--signal); width: 24px; height: 24px; display: grid; place-items: center; margin-top: 2px; }
.choice:hover { border-color: var(--signal); }
.choice:active { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
.chip { font-family: var(--f-mono); font-size: 13px; padding: 2px 9px; border: 1px solid var(--line); line-height: 1.7; }
.chip.good { color: var(--ok); border-color: #3c5232; }
.chip.badc { color: var(--alarm); border-color: #6a2e25; }

.btn {
  font: inherit; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .04em;
  background: var(--signal); color: #14150f; border: 0; border-radius: 2px; padding: 12px 24px; min-height: 48px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); font-weight: 500; }
.btn:hover { filter: brightness(1.08); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* Intro and ending */
.title { font-family: var(--f-display); font-weight: 700; font-size: clamp(54px, 17vw, 92px); line-height: .95; letter-spacing: -.01em; margin: 26px 0 6px; }
.title span { color: var(--signal); }
.sub { font-size: 19px; line-height: 1.55; color: var(--bone); margin: 0 0 20px; max-width: 30ch; }
.rules { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 6px; font-size: 15px; color: var(--dim); }
.rules li { padding-left: 16px; position: relative; line-height: 1.55; }
.rules li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; background: var(--signal); }

.end-kind { font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; margin-top: 8px; }
.end-kind.dead { color: var(--alarm); }
.end-kind.live { color: var(--ok); }
.end-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 8vw, 42px); line-height: 1.15; margin: 4px 0 10px; text-wrap: balance; }
.recap { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 18px 0; }
.recap div { background: var(--panel); padding: 10px 12px; min-width: 0; }
.recap .k { font-size: 12px; color: var(--dim); line-height: 1.4; }
.recap .v { font-family: var(--f-mono); font-size: 18px; color: var(--bone); line-height: 1.4; }
.recap .v.odds-v { color: var(--signal); }
.real { margin-top: 22px; padding: 14px 16px; border: 1px dashed var(--line); font-size: 15px; line-height: 1.65; color: var(--dim); }
.real h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); }
.real ul { margin: 0; padding-left: 18px; }
.found { margin-top: 18px; font-size: 13px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.pips { display: flex; gap: 4px; }
.pips i { width: 14px; height: 6px; background: #2a2f22; display: block; }
.pips i.on { background: var(--signal); }
.toast { font-size: 14px; color: var(--ok); align-self: center; }

.prog { display: flex; gap: 3px; margin-top: 10px; }
.prog i { flex: 1; height: 3px; background: #23271d; }
.prog i.on { background: var(--signal); }

/* Artwork: flat SVG scenes, drawn with the page's own palette */
.art { display: block; width: 100%; height: auto; margin: 4px 0 12px; border: 1px solid var(--line); background: #171b14; }
.f-sky { fill: #171b14; } .f-far { fill: #262c1f; } .f-near { fill: #0d0f0b; }
.f-bone { fill: var(--bone); } .f-dim { fill: var(--dim); } .f-signal { fill: var(--signal); } .f-alarm { fill: var(--alarm); } .f-ok { fill: var(--ok); } .f-flash { fill: #fff6d6; }
.s-line { stroke: #3a4230; fill: none; stroke-width: 1; }
.s-near { stroke: #0d0f0b; fill: none; stroke-width: 2.5; stroke-linecap: round; }
.s-bone { stroke: var(--bone); fill: none; stroke-width: 1.8; stroke-linecap: round; }
.s-dim { stroke: var(--dim); fill: none; stroke-width: 1.2; stroke-linecap: round; }
.s-signal { stroke: var(--signal); fill: none; stroke-width: 1.6; stroke-linecap: round; }
.s-alarm { stroke: var(--alarm); fill: none; stroke-width: 1.6; }
.mapsvg .t { font: 11px var(--f-body); fill: var(--dim); }
.mapsvg .t-big { font: 700 20px var(--f-mono); fill: var(--signal); }
.mapsvg .t-bad { font: 600 12px var(--f-body); fill: var(--alarm); }
.mapsvg .t-ok { font: 600 12px var(--f-body); fill: var(--ok); }
.s-ok { stroke: var(--ok); fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.s-alarm2 { stroke: var(--alarm); fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.s-bone, .s-signal { stroke-linejoin: round; }
.pick { margin-top: 18px; font-size: 14px; color: var(--dim); }
.pick summary { cursor: pointer; padding: 6px 0; }
.pick .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.pick .row button { font: inherit; font-size: 14px; background: var(--panel); color: var(--bone); border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; }
.pick .row button:hover { border-color: var(--signal); }
.mapsvg .t-sm { font: 10px var(--f-mono); fill: var(--dim); }
.item.bad { color: var(--alarm); border-color: #6a2e25; }
.namerow { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.namerow .end-title { margin: 0; }
.avatar { width: 72px; height: 72px; flex: none; border-radius: 50%; border: 1px solid var(--line); }
.who-row { display: flex; align-items: center; gap: 10px; margin: -2px 0 8px; }
.who-row .avatar { width: 40px; height: 40px; }
.who-row .who-line { margin: 0; }
.log { margin-top: 20px; }
.log h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); }
.log ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; line-height: 1.55; }
.log li { padding-left: 16px; position: relative; color: var(--dim); }
.log li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; background: var(--dim); }
.log li.up { color: var(--bone); } .log li.up::before { background: var(--ok); }
.log li.down { color: var(--bone); } .log li.down::before { background: var(--alarm); }
.roll-k { font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin-top: 24px; }
.roll-name { font-family: var(--f-display); font-weight: 700; font-size: clamp(40px, 12vw, 64px); line-height: 1.1; margin: 8px 0 4px; min-height: 1.2em; }
.roll-sub { color: var(--dim); font-size: 15px; min-height: 1.6em; }
.one-in { font-family: var(--f-mono); font-size: 13px; color: var(--dim); line-height: 1.6; margin-top: 18px; }
.one-in b { display: block; font-family: var(--f-display); font-size: 26px; color: var(--signal); font-weight: 700; line-height: 1.2; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 14px 0; font-size: 15px; line-height: 1.55; }
.facts dt { color: var(--dim); }
.facts dd { margin: 0; min-width: 0; }
.pg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
.pg > div { border: 1px solid var(--line); padding: 10px 12px; font-size: 14px; line-height: 1.55; min-width: 0; }
.pg h4 { margin: 0 0 4px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
.pg .up h4 { color: var(--ok); }
.pg .down h4 { color: var(--alarm); }
@media (max-width: 460px) { .pg { grid-template-columns: 1fr; } }
.who-line { color: var(--dim); font-size: 14px; margin: -4px 0 8px; }
.hard { margin-top: 18px; }
.hardbtn { display: inline-flex; align-items: center; gap: 10px; font: inherit; font-size: 15px; background: none; color: var(--bone); border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; }
.hardbtn .sw { width: 28px; height: 14px; border: 1px solid var(--dim); position: relative; display: inline-block; }
.hardbtn .sw::after { content: ""; position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; background: var(--dim); transition: left .15s; }
.hardbtn[aria-pressed="true"] { border-color: var(--alarm); color: var(--alarm); }
.hardbtn[aria-pressed="true"] .sw { border-color: var(--alarm); }
.hardbtn[aria-pressed="true"] .sw::after { left: 15px; background: var(--alarm); }
.hard .hint { margin-top: 6px; font-size: 13px; color: var(--dim); line-height: 1.55; max-width: 52ch; }
.hardtag { display: inline-block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--alarm); border: 1px solid #6a2e25; padding: 0 8px; margin-left: 8px; }
.lifegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin: 6px 0 4px; }
.lifecard { display: flex; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); min-width: 0; }
.lifecard.unplayed { opacity: .55; }
.lifecard .avatar { width: 48px; height: 48px; }
.lc-body { min-width: 0; flex: 1; }
.lc-name { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.3; }
.lc-sub { font-size: 12px; color: var(--dim); line-height: 1.4; }
.lc-bar { height: 4px; background: #23271d; margin: 8px 0 4px; }
.lc-bar i { display: block; height: 100%; background: var(--ok); }
.lc-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--dim); }
.lc-sp { margin-top: 4px; font-size: 12px; color: var(--dim); }
.lc-sp.on { color: var(--signal); }
.snd { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; background: none; border: 1px solid var(--line); color: var(--dim); padding: 1px 8px; cursor: pointer; line-height: 1.7; }
.snd[aria-pressed="true"] { color: var(--signal); border-color: var(--signal); }
.bar .grp { display: flex; align-items: center; gap: 12px; }
.items { display: flex; flex-wrap: wrap; gap: 6px; }
.item { font-size: 12px; padding: 0 8px; border: 1px solid var(--line); color: var(--bone); line-height: 1.9; }
.item.none { color: var(--dim); border-style: dashed; }
.choice:disabled { opacity: .5; cursor: not-allowed; }
.choice:disabled:hover { border-color: var(--line); }
.choice:disabled .key { background: #4a4d3f; color: var(--bone); }
.choice .lock { display: block; font-size: 13px; color: var(--alarm); margin-top: 2px; line-height: 1.4; }
.ready { margin-top: 18px; padding: 14px; border: 1px dashed var(--signal); display: grid; gap: 12px; font-size: 14px; line-height: 1.55; color: var(--dim); }
.ready .btn { width: 100%; }
.timer.urgent .tl { animation: pulse .45s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .35; } }

/* Effects */
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
#flash.go { animation: flash 3s ease-out forwards; }
@keyframes flash { 0%, 12% { opacity: 1; } 100% { opacity: 0; } }
.app.shake { animation: shake .45s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@media (prefers-reduced-motion: reduce) {
  #flash.go { animation: flash-soft 1.2s ease-out forwards; }
  @keyframes flash-soft { 0% { opacity: .5; } 100% { opacity: 0; } }
  .app.shake { animation: none; }
  .fill { transition: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stripe"></div>
  <div class="bar"><span><b>Civil Alert</b></span><span class="grp"><button class="snd" id="snd" type="button" aria-pressed="true">เสียง</button><span id="stepno">DAY ZERO</span></span></div>
  <section class="hud" id="hud" hidden aria-label="สถานะของคุณ">
    <div class="odds">
      <span class="lbl">โอกาสรอดชีวิตของคุณตอนนี้</span>
      <span class="big mono" id="odds"></span>
    </div>
    <div class="meters">
      <div class="meter"><div class="row"><span>สุขภาพ</span><span class="mono" id="v-hp"></span></div><div class="track"><div class="fill" id="b-hp"></div></div></div>
      <div class="meter"><div class="row"><span>รังสีสะสม</span><span class="mono" id="v-rad"></span></div><div class="track"><div class="fill" id="b-rad"></div></div></div>
      <div class="meter"><div class="row"><span>น้ำและอาหาร</span><span class="mono" id="v-food"></span></div><div class="track"><div class="fill" id="b-food"></div></div></div>
      <div class="meter"><div class="row"><span>ขวัญกำลังใจ</span><span class="mono" id="v-hope"></span></div><div class="track"><div class="fill neutral" id="b-hope"></div></div></div>
    </div>
    <div class="items" id="items" aria-label="ของที่มี"></div>
    <div class="prog" id="prog" aria-hidden="true"></div>
  </section>
  <main id="stage"></main>
</div>
<div id="flash" aria-hidden="true"></div>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var stage = $("#stage"), app = $("#app");
  var STORE = "dayzero.endings.v1";
  var S, timerId = null;

  function clock(base, plus) {
    var p = base.split(":"), m = (+p[0]) * 60 + (+p[1]) + plus, h = Math.floor(m / 60) % 24, mm = m % 60;
    return "วันที่ 0 · " + (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm;
  }

  /* per-life epilogue lines and a special ending (needs kindness, health, survival) */
  var EPI = {

  /* record of every run, kept in the browser so the stats page can show how each life went */
  var RUNS_KEY = "dayzero.runs.v1", SPECIAL_KEY = "dayzero.special.v1";
  function loadRuns() { try { return JSON.parse(localStorage.getItem(RUNS_KEY) || "[]"); } catch (e) { return []; } }
  function saveRun(r) {
    var a = loadRuns(); a.push(r); if (a.length > 300) a = a.slice(-300);
    try { localStorage.setItem(RUNS_KEY, JSON.stringify(a)); } catch (e) {}
  }
  function loadSpecial() { try { return JSON.parse(localStorage.getItem(SPECIAL_KEY) || "[]"); } catch (e) { return []; } }
  function saveSpecial(id) {
    var a = loadSpecial();
    if (a.indexOf(id) < 0) { a.push(id); try { localStorage.setItem(SPECIAL_KEY, JSON.stringify(a)); } catch (e) {} }
    return a;
  }
  var RANKV = { D: 0, C: 1, B: 2, A: 3, S: 4 };
  function statsHtml() {
    var runs = loadRuns(), sp = loadSpecial();
    var total = runs.length, alive = runs.filter(function (r) { return !r.dead; }).length;
    var hardAlive = runs.filter(function (r) { return r.hard && !r.dead; }).length;
    var cards = CHARS.map(function (c) {
      var mine = runs.filter(function (r) { return r.id === c.id; });
      var ok = mine.filter(function (r) { return !r.dead; }).length;
      var best = "-"; mine.forEach(function (r) { if (best === "-" || RANKV[r.rk] > RANKV[best]) best = r.rk; });
      var pct = mine.length ? Math.round(ok / mine.length * 100) : 0;
      var has = sp.indexOf(c.id) >= 0;
      return '<div class="lifecard' + (mine.length ? "" : " unplayed") + '">' + avatar(c) +
        '<div class="lc-body"><div class="lc-name">' + c.name + '</div><div class="lc-sub">' + c.job + " · " + c.province + "</div>" +
        '<div class="lc-bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="lc-meta"><span>' + (mine.length ? "เล่น " + mine.length + " · รอด " + ok : "ยังไม่เคยเล่น") + "</span><span>เรตติ้งสูงสุด " + best + '</span></div>' +
        '<div class="lc-sp ' + (has ? "on" : "") + '">' + (has ? "ฉากจบพิเศษ: " + EPI[c.id].best.title : "ฉากจบพิเศษ: ยังไม่พบ") + "</div></div></div>";
    }).join("");
    return '<h2 class="end-title" style="margin-top:24px">บันทึกชีวิต</h2>' +
      '<div class="recap"><div><div class="k">เล่นทั้งหมด</div><div class="v">' + total + '</div></div>' +
      '<div><div class="k">รอดชีวิต</div><div class="v">' + (total ? Math.round(alive / total * 100) : 0) + '%</div></div>' +
      '<div><div class="k">รอดในโหมดยาก</div><div class="v">' + hardAlive + '</div></div>' +
      '<div><div class="k">ฉากจบพิเศษ</div><div class="v odds-v">' + sp.length + "/" + CHARS.length + '</div></div></div>' +
      '<div class="lifegrid">' + cards + '</div><div class="btns"><button class="btn" id="statsback">กลับ</button></div>';
  }

  /* hard mode: shorter timers, supplies run out faster, fallout is worse, and nobody in the community helps you */
  var hardMode = false;
  try { hardMode = localStorage.getItem("dayzero.hard") === "1"; } catch (e) {}
  var tsec = function (sc) { return Math.max(4, Math.round(sc.timer * (S.hard ? 0.6 : 1))); };
  var lastChar = null;
  function fresh(id) {
    var pool = CHARS.filter(function (c) { return c.id !== lastChar; });
    var c = id ? CHARS.filter(function (x) { return x.id === id; })[0] : pool[Math.floor(Math.random() * pool.length)];
    lastChar = c.id;
    var f = {};
    for (var k in c.items) f[k] = c.items[k];
    // where you are decides how hard the blast hits (bf) and how much fallout reaches you (rf)
    var wind = Math.floor(Math.random() * 360);
    var inPlume = c.gz <= 160 && angDiff(c.bearing, wind) <= 40;
    var rf = inPlume ? 1.8 - Math.min(c.gz, 150) / 150 * 0.8 : (c.gz <= 6 ? 0.5 : 0.3);
    if (hardMode) rf *= 1.25;
    var hp0 = hardMode ? Math.max(30, c.hp - 10) : c.hp, hope0 = hardMode ? Math.max(20, c.hope - 10) : c.hope;

  /* line chart of the four stats across the run, labelled at the line ends */
  function chartSvg() {
    var H = S.hist, n = H.length, W = 400, Ht = 150, L = 8, R = 72, T = 10, B = 24;
    if (n < 2) return "";
    var xs = function (i) { return L + (W - L - R) * i / (n - 1); };
    var ys = function (v) { return T + (Ht - T - B) * (1 - Math.max(0, Math.min(100, v)) / 100); };
    var series = [
      { k: "hp", label: "สุขภาพ", cls: "s-ok", f: function (h) { return h.hp; } },
      { k: "rad", label: "รังสี", cls: "s-alarm2", f: function (h) { return h.rad; } },
      { k: "hope", label: "ขวัญ", cls: "s-bone", f: function (h) { return h.hope; } },
      { k: "food", label: "อาหาร", cls: "s-signal", f: function (h) { return h.food / 8 * 100; } }
    ];
    var o = '<rect class="f-sky" width="400" height="' + Ht + '"/>';
    [0, 50, 100].forEach(function (v) { o += '<path class="s-line" d="M' + L + " " + ys(v).toFixed(1) + " H" + (W - R) + '"/>'; });
    series.forEach(function (s) {
      o += '<polyline class="' + s.cls + '" points="' + H.map(function (h, i) { return xs(i).toFixed(1) + "," + ys(s.f(h)).toFixed(1); }).join(" ") + '" fill="none"/>';
      var last = s.f(H[n - 1]);
      o += '<circle class="' + s.cls.replace("s-", "f-").replace("alarm2", "alarm") + '" cx="' + xs(n - 1).toFixed(1) + '" cy="' + ys(last).toFixed(1) + '" r="3"/>';
      s.y = ys(last);
    });
    // spread end labels so they don't collide
    var sorted = series.slice().sort(function (a, b) { return a.y - b.y; });
    var gap = 14, bottom = Ht - B - 2, top = T + 6, m = sorted.length, i;
    for (i = 1; i < m; i++) if (sorted[i].y - sorted[i - 1].y < gap) sorted[i].y = sorted[i - 1].y + gap;
    for (i = m - 1; i >= 0; i--) sorted[i].y = Math.min(sorted[i].y, bottom - (m - 1 - i) * gap); // keep inside the bottom edge
    for (i = 0; i < m; i++) sorted[i].y = Math.max(sorted[i].y, top + i * gap); // and inside the top edge
    sorted.forEach(function (s) { o += '<text class="t" x="' + (W - R + 10) + '" y="' + (s.y + 4).toFixed(1) + '">' + s.label + "</text>"; });
    o += '<text class="t-sm" x="' + L + '" y="' + (Ht - 6) + '">วันที่ ' + H[0].day + '</text><text class="t-sm" text-anchor="end" x="' + (W - R) + '" y="' + (Ht - 6) + '">วันที่ ' + H[n - 1].day + "</text>";
    return '<div class="log"><h3>เส้นทางของคุณ</h3><svg class="art mapsvg" viewBox="0 0 400 ' + Ht + '" role="img" aria-label="กราฟสุขภาพ รังสี ขวัญกำลังใจ และอาหารตลอดเกม" preserveAspectRatio="xMidYMid meet">' + o + "</svg></div>";
  }

    sfx.sting(!dead);
    var o = dead ? "—" : "1 ใน " + odds();
    saveRun({ id: S.char.id, end: id, rk: rk, dead: dead, hard: !!S.hard, day: S.day, k: S.karma, sp: special, t: Date.now() });
    var pips = ORDER.map(function (k) { return '<i class="' + (seen.indexOf(k) >= 0 ? "on" : "") + '"></i>'; }).join("");
    var shareText = "Day Zero" + (S.hard ? " [โหมดยาก]" : "") + ": ฉันเป็น" + S.char.name + " (" + S.char.job + " " + S.char.province + ") · " + e.title + " · เรตติ้ง " + rk + " · รอดมา " + S.day + " วัน · โอกาสรอด " + o + " ลองเล่นดูไหม";
    var logHtml = S.log.length
      ? '<div class="log"><h3>สิ่งที่คุณเลือกไว้</h3><ul>' + S.log.map(function (l) { return '<li class="' + (l.k > 0 ? "up" : l.k < 0 ? "down" : "") + '">' + l.t + "</li>"; }).join("") + "</ul></div>"
      : "";
    stage.innerHTML =
      art(dead ? "ruin" : "dawn") +
      '<div class="end-kind ' + e.kind + '">' + (dead ? "จบเกม · ไม่รอด" : "จบเกม · รอดชีวิต") + (special ? '<span class="hardtag" style="color:var(--signal);border-color:var(--signal)">ฉากจบพิเศษ</span>' : "") + (S.hard ? '<span class="hardtag">โหมดยาก</span>' : "") + "</div>" +
      '<h2 class="end-title">' + e.title + "</h2>" +
      '<div class="who-row">' + avatar(S.char) + '<div class="who-line">' + S.char.name + " · " + S.char.gender + " " + S.char.age + " ปี · " + S.char.job + " · " + S.char.province + "</div></div>" +
      '<div class="story">' + paras(e.body + extra) + "</div>" +
      '<div class="recap">' +
      '<div><div class="k">วันที่เอาชีวิตรอด</div><div class="v">' + S.day + "</div></div>" +
      '<div><div class="k">รังสีสะสม</div><div class="v">' + mSv(S.rad).toLocaleString("en") + " mSv</div></div>" +
      '<div><div class="k">สุขภาพ</div><div class="v">' + Math.round(S.hp) + "%</div></div>" +
      '<div><div class="k">โอกาสรอด (ตามเกม)</div><div class="v odds-v">' + o + "</div></div>" +
      '<div><div class="k">เรตติ้ง</div><div class="v odds-v">' + rk + "</div></div>" +
      '<div><div class="k">ความดีที่ทำไว้</div><div class="v">' + (S.karma > 0 ? "+" : "") + S.karma + "</div></div>" +
      '<div><div class="k">ห่างจุดระเบิด</div><div class="v">' + S.char.gz + " กม.</div></div>" +
      "</div>" +
      chartSvg() +
      logHtml +
      '<div class="real"><h3>ถ้าเกิดเรื่องจริง</h3><ul>' +
      "<li>เข้าอาคารที่แข็งแรงทันที ไปที่ห้องตรงกลางตึกหรือใต้ดิน ไกลจากหน้าต่าง</li>" +
      "<li>อยู่ข้างในไว้อย่างน้อย 24 ชั่วโมง จนกว่าทางการจะประกาศว่าออกได้</li>" +
      "<li>ถอดเสื้อผ้าชั้นนอกที่เปื้อนฝุ่นทิ้ง แล้วล้างตัว จะลดสิ่งปนเปื้อนได้มาก</li>" +
      "<li>ฟังประกาศจากหน่วยงานทางการทางวิทยุหรือโทรศัพท์</li>" +
      '</ul><div style="margin-top:8px;font-size:13px">เกมนี้เป็นเรื่องแต่ง ตัวเลขทั้งหมดเป็นการประมาณเพื่อความบันเทิง</div></div>' +
      '<div class="btns"><button class="btn" id="again">เล่นอีกครั้ง</button><button class="btn ghost" id="share">คัดลอกผลลัพธ์</button><span class="toast" id="toast" role="status"></span></div>' +
      '<div class="found"><span>ฉากจบที่พบ ' + seen.length + "/" + ORDER.length + '</span><span class="pips">' + pips + '</span><span>ชีวิตที่ได้ลอง ' + chars.length + "/" + CHARS.length + "</span></div>";
    $("#hud").hidden = false; hud();
    $("#stepno").textContent = "จบเกม";
    $("#again").addEventListener("click", intro);
    $("#share").addEventListener("click", function () {
      var t = $("#toast");
      function ok() { t.textContent = "คัดลอกแล้ว"; }
      function fail() { t.textContent = shareText; }
      try {
        navigator.clipboard.writeText(shareText).then(ok, fail);
      } catch (err) { fail(); }
    });
    window.scrollTo(0, 0);
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var n = parseInt(ev.key, 10);
    if (n >= 1 && n <= 9) {
      var btns = stage.querySelectorAll(".choice");
      if (btns[n - 1]) btns[n - 1].click();
    }
  });

  var sndBtn = $("#snd");
  function paintSnd() { sndBtn.setAttribute("aria-pressed", soundOn ? "true" : "false"); sndBtn.textContent = soundOn ? "เสียง เปิด" : "เสียง ปิด"; }
  sndBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem("dayzero.sound", soundOn ? "on" : "off"); } catch (e) {}
    paintSnd();
    if (soundOn) sfx.pick();
  });
  paintSnd();

  intro();
})();
</script>
</body>
</html>
