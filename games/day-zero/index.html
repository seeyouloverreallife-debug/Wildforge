<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Zero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column styled as a civil-defence alert terminal. HUD on top, story and choices below. Single committed dark look. */
:root {
  --ground: #0f110d;
  --panel: #171a14;
  --line: #2f3527;
  --bone: #ebe8d8;
  --dim: #a3a691;
  --signal: #e8c547;
  --alarm: #e5533d;
  --ok: #8fbf7a;
  --f-display: "Chakra Petch", "IBM Plex Sans Thai", sans-serif;
  --f-body: "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--ground);
  color: var(--bone);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.75;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app {
  max-width: 600px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
.stripe {
  height: 8px;
  background: repeating-linear-gradient(-45deg, var(--signal) 0 10px, #0f110d 10px 20px);
}
.bar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
}
.bar b { color: var(--signal); font-weight: 500; }

/* HUD */
.hud { padding-block: 16px 4px; display: grid; gap: 14px; }
.odds { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.odds .lbl { font-size: 13px; color: var(--dim); letter-spacing: .04em; }
.odds .big { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--signal); }
.odds .big small { font-size: 15px; font-weight: 500; color: var(--bone); margin-right: 6px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.meter { min-width: 0; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 1.3; color: var(--dim); }
.meter .row .mono { color: var(--bone); font-size: 12px; }
.track { height: 6px; background: #23271d; margin-top: 6px; position: relative; overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ok); transition: width .6s ease, background-color .4s; }
.fill.warn { background: var(--signal); }
.fill.bad { background: var(--alarm); }
.fill.neutral { background: var(--bone); }

/* Story */
main { padding-top: 22px; }
.when { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13px; color: var(--dim); }
.when .mono { color: var(--signal); font-size: 14px; letter-spacing: .06em; }
.story { margin-top: 12px; }
.story p { margin: 0 0 14px; max-width: 62ch; }
.story .alert-tag {
  display: inline-block; font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  background: var(--alarm); color: #fff; padding: 1px 8px; margin-right: 8px; line-height: 1.6; vertical-align: 1px;
}
.picked { margin: 16px 0 6px; padding-left: 12px; border-left: 3px solid var(--signal); color: var(--dim); font-size: 15px; line-height: 1.6; }

.timer { margin: 18px 0 10px; display: flex; align-items: center; gap: 12px; }
.timer .tt { flex: 1; height: 6px; background: #23271d; position: relative; }
.timer .tf { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--alarm); }
.timer .tl { font-family: var(--f-mono); font-size: 14px; color: var(--alarm); min-width: 3.4ch; text-align: right; }

.choices { display: grid; gap: 10px; margin-top: 16px; }
.timer + .choices { margin-top: 0; }
.choice {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left;
  background: var(--panel); color: var(--bone); border: 1px solid var(--line); border-radius: 2px;
  padding: 13px 14px; font: inherit; font-size: 16px; line-height: 1.55; cursor: pointer; min-height: 52px; width: 100%;
}
.choice .key { font-family: var(--f-mono); font-size: 13px; color: var(--ground); background: var(--signal); width: 24px; height: 24px; display: grid; place-items: center; margin-top: 2px; }
.choice:hover { border-color: var(--signal); }
.choice:active { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
.chip { font-family: var(--f-mono); font-size: 13px; padding: 2px 9px; border: 1px solid var(--line); line-height: 1.7; }
.chip.good { color: var(--ok); border-color: #3c5232; }
.chip.badc { color: var(--alarm); border-color: #6a2e25; }

.btn {
  font: inherit; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .04em;
  background: var(--signal); color: #14150f; border: 0; border-radius: 2px; padding: 12px 24px; min-height: 48px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); font-weight: 500; }
.btn:hover { filter: brightness(1.08); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* Intro and ending */
.title { font-family: var(--f-display); font-weight: 700; font-size: clamp(54px, 17vw, 92px); line-height: .95; letter-spacing: -.01em; margin: 26px 0 6px; }
.title span { color: var(--signal); }
.sub { font-size: 19px; line-height: 1.55; color: var(--bone); margin: 0 0 20px; max-width: 30ch; }
.rules { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 6px; font-size: 15px; color: var(--dim); }
.rules li { padding-left: 16px; position: relative; line-height: 1.55; }
.rules li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; background: var(--signal); }

.end-kind { font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; margin-top: 8px; }
.end-kind.dead { color: var(--alarm); }
.end-kind.live { color: var(--ok); }
.end-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 8vw, 42px); line-height: 1.15; margin: 4px 0 10px; text-wrap: balance; }
.recap { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 18px 0; }
.recap div { background: var(--panel); padding: 10px 12px; min-width: 0; }
.recap .k { font-size: 12px; color: var(--dim); line-height: 1.4; }
.recap .v { font-family: var(--f-mono); font-size: 18px; color: var(--bone); line-height: 1.4; }
.recap .v.odds-v { color: var(--signal); }
.real { margin-top: 22px; padding: 14px 16px; border: 1px dashed var(--line); font-size: 15px; line-height: 1.65; color: var(--dim); }
.real h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); }
.real ul { margin: 0; padding-left: 18px; }
.found { margin-top: 18px; font-size: 13px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.pips { display: flex; gap: 4px; }
.pips i { width: 14px; height: 6px; background: #2a2f22; display: block; }
.pips i.on { background: var(--signal); }
.toast { font-size: 14px; color: var(--ok); align-self: center; }

.prog { display: flex; gap: 3px; margin-top: 10px; }
.prog i { flex: 1; height: 3px; background: #23271d; }
.prog i.on { background: var(--signal); }

.snd { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; background: none; border: 1px solid var(--line); color: var(--dim); padding: 1px 8px; cursor: pointer; line-height: 1.7; }
.snd[aria-pressed="true"] { color: var(--signal); border-color: var(--signal); }
.bar .grp { display: flex; align-items: center; gap: 12px; }
.items { display: flex; flex-wrap: wrap; gap: 6px; }
.item { font-size: 12px; padding: 0 8px; border: 1px solid var(--line); color: var(--bone); line-height: 1.9; }
.item.none { color: var(--dim); border-style: dashed; }
.choice:disabled { opacity: .5; cursor: not-allowed; }
.choice:disabled:hover { border-color: var(--line); }
.choice:disabled .key { background: #4a4d3f; color: var(--bone); }
.choice .lock { display: block; font-size: 13px; color: var(--alarm); margin-top: 2px; line-height: 1.4; }
.ready { margin-top: 18px; padding: 14px; border: 1px dashed var(--signal); display: grid; gap: 12px; font-size: 14px; line-height: 1.55; color: var(--dim); }
.ready .btn { width: 100%; }
.timer.urgent .tl { animation: pulse .45s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .35; } }

/* Effects */
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
#flash.go { animation: flash 3s ease-out forwards; }
@keyframes flash { 0%, 12% { opacity: 1; } 100% { opacity: 0; } }
.app.shake { animation: shake .45s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@media (prefers-reduced-motion: reduce) {
  #flash.go { animation: flash-soft 1.2s ease-out forwards; }
  @keyframes flash-soft { 0% { opacity: .5; } 100% { opacity: 0; } }
  .app.shake { animation: none; }
  .fill { transition: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stripe"></div>
  <div class="bar"><span><b>Civil Alert</b></span><span class="grp"><button class="snd" id="snd" type="button" aria-pressed="true">เสียง</button><span id="stepno">DAY ZERO</span></span></div>
  <section class="hud" id="hud" hidden aria-label="สถานะของคุณ">
    <div class="odds">
      <span class="lbl">โอกาสรอดชีวิตของคุณตอนนี้</span>
      <span class="big mono" id="odds"></span>
    </div>
    <div class="meters">
      <div class="meter"><div class="row"><span>สุขภาพ</span><span class="mono" id="v-hp"></span></div><div class="track"><div class="fill" id="b-hp"></div></div></div>
      <div class="meter"><div class="row"><span>รังสีสะสม</span><span class="mono" id="v-rad"></span></div><div class="track"><div class="fill" id="b-rad"></div></div></div>
      <div class="meter"><div class="row"><span>น้ำและอาหาร</span><span class="mono" id="v-food"></span></div><div class="track"><div class="fill" id="b-food"></div></div></div>
      <div class="meter"><div class="row"><span>ขวัญกำลังใจ</span><span class="mono" id="v-hope"></span></div><div class="track"><div class="fill neutral" id="b-hope"></div></div></div>
    </div>
    <div class="items" id="items" aria-label="ของที่มี"></div>
    <div class="prog" id="prog" aria-hidden="true"></div>
  </section>
  <main id="stage"></main>
</div>
<div id="flash" aria-hidden="true"></div>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var stage = $("#stage"), app = $("#app");
  var STORE = "dayzero.endings.v1";
  var S, timerId = null;

  function fresh() {
    return { hp: 100, rad: 0, food: 1, hope: 70, cause: "starve", f: {}, i: 0, day: 0, ev: Math.floor(Math.random() * EVENTS.length) };
  }
  function cur() { var sc = SC[S.i]; return sc.pick ? EVENTS[S.ev] : sc; }

  /* ---------- sound (synthesized, starts after the first tap) ---------- */
  var AC = null, soundOn = true;
  try { soundOn = localStorage.getItem("dayzero.sound") !== "off"; } catch (e) {}
  function ctx() {
    if (!soundOn) return null;
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  function tone(f, d, type, v, delay, f2) {
    var c = ctx(); if (!c) return;
    var t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.linearRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.05, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.05);
  }
  function noise(d, v, fc, delay) {
    var c = ctx(); if (!c) return;
    var t = c.currentTime + (delay || 0), n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), a = buf.getChannelData(0);
    for (var i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = c.createBufferSource(); s.buffer = buf;
    var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = fc || 800;
    var g = c.createGain(); g.gain.value = v || 0.2;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  }
  var sfx = {
    siren: function () { for (var k = 0; k < 3; k++) { tone(520, 0.8, "sawtooth", 0.035, k * 1.6, 880); tone(880, 0.8, "sawtooth", 0.035, k * 1.6 + 0.8, 520); } },
    tick: function (hi) { tone(hi ? 1250 : 720, 0.06, "square", 0.03); },
    boom: function () { noise(2.4, 0.5, 500); tone(60, 2, "sine", 0.25, 0, 28); },
    pick: function () { tone(440, 0.07, "square", 0.025); },
    hurt: function () { tone(150, 0.25, "sawtooth", 0.06, 0, 70); },
    geiger: function (n) { for (var i = 0; i < n; i++) noise(0.012, 0.12, 6000, Math.random() * 1.6); },
    sting: function (good) {
      if (good) { tone(392, 0.5, "triangle", 0.06); tone(523, 0.5, "triangle", 0.06, 0.18); tone(659, 0.9, "triangle", 0.06, 0.36); }
      else { tone(196, 0.7, "sawtooth", 0.05, 0, 98); tone(147, 1.2, "sawtooth", 0.05, 0.4, 73); }
    }
  };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var mSv = function (r) { return Math.round(r * 50); };

  /* ---------- odds ---------- */
  function odds() {
    var score = (S.hp / 100) * 0.4 + (1 - S.rad / 100) * 0.35 + (Math.min(S.food, 8) / 8) * 0.15 + (S.hope / 100) * 0.1;
    var p = 0.02 + 0.5 * Math.pow(score, 3);
    return Math.max(2, Math.round(1 / p));
  }

  /* ---------- state changes ---------- */
  function snap() { return { hp: S.hp, rad: S.rad, food: S.food, hope: S.hope }; }
  function apply(d) {
    d = d || {};
    var b = snap();
    S.hp += d.hp || 0; S.rad += d.rad || 0; S.hope += d.hope || 0; S.food += d.food || 0;
    if (d.cause) S.cause = d.cause;
    if (S.food < 0) { S.hp += S.food * 12; S.food = 0; S.cause = "starve"; }
    S.hp = clamp(S.hp, 0, 100); S.rad = clamp(S.rad, 0, 100); S.hope = clamp(S.hope, 0, 100); S.food = clamp(S.food, 0, 12);
    var a = snap();
    return { hp: a.hp - b.hp, rad: a.rad - b.rad, food: a.food - b.food, hope: a.hope - b.hope };
  }
  function isDead() { return S.hp <= 0 || S.rad >= 100; }
  function deathCause() { return S.rad >= 100 ? "rad" : S.cause; }

  /* ---------- HUD ---------- */
  function setBar(id, pct, mode) {
    var el = $("#b-" + id);
    el.style.width = clamp(pct, 0, 100) + "%";
    if (mode !== "neutral") el.className = "fill" + (mode === "bad" ? " bad" : mode === "warn" ? " warn" : "");
  }
  function hud() {
    $("#hud").hidden = false;
    $("#odds").innerHTML = isDead() ? "—" : "<small>1 ใน</small>" + odds();
    $("#v-hp").textContent = Math.round(S.hp) + "%";
    setBar("hp", S.hp, S.hp < 30 ? "bad" : S.hp < 60 ? "warn" : "ok");
    $("#v-rad").textContent = mSv(S.rad).toLocaleString("en") + " mSv";
    setBar("rad", S.rad, S.rad > 60 ? "bad" : S.rad > 25 ? "warn" : "ok");
    $("#v-food").textContent = S.food + " วัน";
    setBar("food", (S.food / 8) * 100, S.food <= 1 ? "bad" : S.food <= 3 ? "warn" : "ok");
    $("#v-hope").textContent = Math.round(S.hope) + "%";
    setBar("hope", S.hope, "neutral");
    var inv = ITEMS.filter(function (it) { return S.f[it[0]]; }).map(function (it) { return '<span class="item">' + it[1] + "</span>"; });
    $("#items").innerHTML = inv.length ? inv.join("") : '<span class="item none">ยังไม่มีของติดตัว</span>';
    var p = "";
    for (var k = 0; k < SC.length; k++) p += '<i class="' + (k <= S.i ? "on" : "") + '"></i>';
    $("#prog").innerHTML = p;
    $("#stepno").textContent = "ฉาก " + Math.min(S.i + 1, SC.length) + "/" + SC.length;
  }

  /* ---------- helpers ---------- */
  function paras(t) {
    return t.split("\n\n").map(function (p) { return "<p>" + p + "</p>"; }).join("");
  }
  function chips(diff) {
    var out = [];
    function add(label, v, text, goodWhenUp) {
      if (!v) return;
      var good = goodWhenUp ? v > 0 : v < 0;
      out.push('<span class="chip ' + (good ? "good" : "badc") + '">' + label + " " + text + "</span>");
    }
    add("สุขภาพ", Math.round(diff.hp), (diff.hp > 0 ? "+" : "") + Math.round(diff.hp), true);
    add("รังสี", diff.rad, (diff.rad > 0 ? "+" : "") + mSv(diff.rad) + " mSv", false);
    add("เสบียง", diff.food, (diff.food > 0 ? "+" : "") + diff.food + " วัน", true);
    add("ขวัญ", Math.round(diff.hope), (diff.hope > 0 ? "+" : "") + Math.round(diff.hope), true);
    return out.length ? '<div class="chips">' + out.join("") + "</div>" : "";
  }
  function head(sc) {
    return '<div class="when"><span class="mono">' + sc.when + "</span><span>" + sc.place + "</span></div>";
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  /* ---------- scenes ---------- */
  var SC = [
    {
      when: "วันที่ 0 · 07:42", place: "คอนโด ชั้น 22 · กรุงเทพฯ", day: 0, timer: 12,
      text: function () {
        return '<span class="alert-tag">แจ้งเตือนภัย</span>โทรศัพท์สั่นพร้อมเสียงไซเรนที่คุณไม่เคยได้ยินมาก่อน\n\nตรวจพบขีปนาวุธมุ่งหน้าเข้าสู่ภูมิภาค คาดว่าจะถึงเป้าหมายในอีก 14 นาที ให้หาที่กำบังทันที\n\nความขัดแย้งที่ทุกคนบอกว่า "ไม่มีวันลุกลาม" เพิ่งกลายเป็นสงครามโลกครั้งที่ 3 และคุณยังใส่ชุดนอนอยู่';
      },
      choices: [
        { t: "คว้ากระเป๋าฉุกเฉินกับน้ำดื่มทั้งหมดในตู้เย็น", r: function () {
          return { txt: "คุณยัดน้ำ 12 ขวด ขนมปัง และไฟฉายลงกระเป๋า ใช้เวลาไปสี่นาที แต่มันคือทรัพย์สินทั้งหมดของคุณตอนนี้", d: { food: 3 }, set: { packed: 1 } };
        } },
        { t: "โทรหาแม่ที่ต่างจังหวัด", r: function () {
          return { txt: "สายต่อติดแค่สามวินาที ได้ยินเสียงแม่พูดว่า \"ลูก อยู่ตรงนั้นแหละ\" แล้วสายก็ขาด นาทีที่เสียไปนับถอยหลังอยู่ในหัวคุณ", d: { hope: 10 }, set: { late: 1 } };
        } },
        { t: "เปิดข่าวดูก่อนว่าเกิดอะไรขึ้น", r: function () {
          return { txt: "ทุกช่องเป็นภาพนิ่งกับเสียงบี๊บ ไม่มีใครรู้อะไรมากกว่าที่คุณรู้ คุณเสียเวลาไปห้านาทีเต็ม", d: { hope: -10 }, set: { late: 1 } };

        '<div class="ready"><span>ฉากนี้มีเวลาจำกัด ' + sc.timer + ' วินาที อ่านข้อความด้านบนให้จบก่อน แล้วกดเมื่อพร้อม</span>' +
        '<button class="btn" id="go">พร้อมแล้ว · เริ่มจับเวลา</button></div>';
      $("#go").addEventListener("click", function () { showChoices(sc, story); });
      $("#go").focus({ preventScroll: true });
    } else {
      showChoices(sc, story);
    }
    window.scrollTo(0, 0);
  }

  function showChoices(sc, story) {
    var list = sc.choices;
    var html = story;
    if (sc.timer) {
      html += '<div class="timer" id="timer"><div class="tt"><div class="tf" id="tf"></div></div><div class="tl" id="tl">' + sc.timer + "</div></div>";
    }
    html += '<div class="choices">' + list.map(function (c, n) {
      var label = typeof c.t === "function" ? c.t() : c.t;
      var why = c.lock ? c.lock(S) : null;
      return '<button class="choice" data-n="' + n + '"' + (why ? " disabled" : "") + '><span class="key">' + (n + 1) + "</span><span>" + label +
        (why ? '<span class="lock">ล็อก · ' + why + "</span>" : "") + "</span></button>";
    }).join("") + "</div>";
    stage.innerHTML = html;
    Array.prototype.forEach.call(stage.querySelectorAll(".choice"), function (b) {
      b.addEventListener("click", function () { choose(list[+b.getAttribute("data-n")], false); });
    });
    if (sc.blast) {
      sfx.boom();
      var fl = $("#flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
    }
    if (sc.timer) {
      var total = sc.timer * 1000, t0 = Date.now(), lastSec = sc.timer;
      timerId = setInterval(function () {
        var left = total - (Date.now() - t0);
        var tf = $("#tf"), tl = $("#tl");
        if (!tf) { stopTimer(); return; }
        tf.style.width = clamp(left / total * 100, 0, 100) + "%";
        var sec = Math.max(0, Math.ceil(left / 1000));
        tl.textContent = sec;
        if (sec !== lastSec && sec > 0) { lastSec = sec; sfx.tick(sec <= 3); }
        if (sec <= 3) $("#timer").classList.add("urgent");
        if (left <= 0) { stopTimer(); choose(sc.timeout, true); }
      }, 100);
    }
  }

  function choose(c, timedOut) {
    stopTimer();
    var sc = cur();
    sfx.pick();
    var res = c.r(S);
    if (res.set) for (var k in res.set) S.f[k] = res.set[k];
    var diff = apply(res.d);
    hud();
    if (diff.hp < -3 || diff.rad >= 8) {
      app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
      sfx.hurt();
    }
    var dead = isDead();
    var label = typeof c.t === "function" ? c.t() : c.t;
    stage.innerHTML = head(sc) +
      '<div class="picked">' + (timedOut ? "เวลาหมด · " : "คุณเลือก · ") + label + "</div>" +
      '<div class="story">' + paras(res.txt) + "</div>" + chips(diff) +
      '<div class="btns"><button class="btn" id="next">' + (dead ? "ดูจุดจบ" : (S.i === SC.length - 1 ? "ดูผลลัพธ์" : "ต่อไป")) + "</button></div>";
    var nb = $("#next");
    nb.addEventListener("click", function () {
      if (dead) return ending(true);
      S.i++;
      if (S.i >= SC.length) return ending(false);
      scene();
    });
    nb.focus({ preventScroll: true });
  }

  function ending(dead) {
    stopTimer();
    var id = pickEnding(dead), e = ENDINGS[id];
    var seen = saveSeen(id);
    var extra = "";
    if (!dead) {
      if (S.f.shared) extra += " คนที่คุณแบ่งเสบียงให้ยังจำคุณได้ คืนนี้คุณไม่ต้องนอนเฝ้าคนเดียว";
      else if (S.f.kept) extra += " คุณมีเสบียงเก็บไว้ แต่คืนนี้คุณนอนหลับไม่สนิทเหมือนเดิม";
      if (S.f.ally) extra += " เด็กหญิงที่คุณเปิดประตูให้ยังจับมือคุณไว้ตลอดทาง";
      if (S.f.group) extra += " กลุ่มคนที่คุณชวนมาด้วยกัน กลายเป็นครอบครัวชั่วคราว";
      if (S.f.dog) extra += " สุนัขตัวผอมนอนขดอยู่ที่เท้าคุณ มันหนักขึ้นเล็กน้อยตั้งแต่วันแรกที่เจอกัน";
    }
    var pts = S.hp * 0.3 + (100 - S.rad) * 0.3 + S.hope * 0.2 + (S.f.shared ? 10 : 0) + (S.f.ally ? 8 : 0) + (S.f.group ? 8 : 0) + (S.f.dog ? 4 : 0) + (id === "shelter" || id === "community" ? 15 : 0);
    var rk = dead ? "D" : pts >= 85 ? "S" : pts >= 70 ? "A" : pts >= 55 ? "B" : "C";
    sfx.sting(!dead);
    var o = dead ? "—" : "1 ใน " + odds();
    var pips = ORDER.map(function (k) { return '<i class="' + (seen.indexOf(k) >= 0 ? "on" : "") + '"></i>'; }).join("");
    var shareText = "Day Zero: " + e.title + " · เรตติ้ง " + rk + " · รอดมา " + S.day + " วัน · โอกาสรอด " + o + " ลองเล่นดูไหม";
    stage.innerHTML =
      '<div class="end-kind ' + e.kind + '">' + (dead ? "จบเกม · ไม่รอด" : "จบเกม · รอดชีวิต") + "</div>" +
      '<h2 class="end-title">' + e.title + "</h2>" +
      '<div class="story">' + paras(e.body + extra) + "</div>" +
      '<div class="recap">' +
      '<div><div class="k">วันที่เอาชีวิตรอด</div><div class="v">' + S.day + "</div></div>" +
      '<div><div class="k">รังสีสะสม</div><div class="v">' + mSv(S.rad).toLocaleString("en") + " mSv</div></div>" +
      '<div><div class="k">สุขภาพ</div><div class="v">' + Math.round(S.hp) + "%</div></div>" +
      '<div><div class="k">โอกาสรอด (ตามเกม)</div><div class="v odds-v">' + o + "</div></div>" +
      '<div><div class="k">เรตติ้ง</div><div class="v odds-v">' + rk + "</div></div>" +
      "</div>" +
      '<div class="real"><h3>ถ้าเกิดเรื่องจริง</h3><ul>' +
      "<li>เข้าอาคารที่แข็งแรงทันที ไปที่ห้องตรงกลางตึกหรือใต้ดิน ไกลจากหน้าต่าง</li>" +
      "<li>อยู่ข้างในไว้อย่างน้อย 24 ชั่วโมง จนกว่าทางการจะประกาศว่าออกได้</li>" +
      "<li>ถอดเสื้อผ้าชั้นนอกที่เปื้อนฝุ่นทิ้ง แล้วล้างตัว จะลดสิ่งปนเปื้อนได้มาก</li>" +
      "<li>ฟังประกาศจากหน่วยงานทางการทางวิทยุหรือโทรศัพท์</li>" +
      '</ul><div style="margin-top:8px;font-size:13px">เกมนี้เป็นเรื่องแต่ง ตัวเลขทั้งหมดเป็นการประมาณเพื่อความบันเทิง</div></div>' +
      '<div class="btns"><button class="btn" id="again">เล่นอีกครั้ง</button><button class="btn ghost" id="share">คัดลอกผลลัพธ์</button><span class="toast" id="toast" role="status"></span></div>' +
      '<div class="found"><span>ฉากจบที่พบ ' + seen.length + "/" + ORDER.length + '</span><span class="pips">' + pips + "</span></div>";
    $("#hud").hidden = false; hud();
    $("#stepno").textContent = "จบเกม";
    $("#again").addEventListener("click", intro);
    $("#share").addEventListener("click", function () {
      var t = $("#toast");
      function ok() { t.textContent = "คัดลอกแล้ว"; }
      function fail() { t.textContent = shareText; }
      try {
        navigator.clipboard.writeText(shareText).then(ok, fail);
      } catch (err) { fail(); }
    });
    window.scrollTo(0, 0);
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var n = parseInt(ev.key, 10);
    if (n >= 1 && n <= 9) {
      var btns = stage.querySelectorAll(".choice");
      if (btns[n - 1]) btns[n - 1].click();
    }
  });

  var sndBtn = $("#snd");
  function paintSnd() { sndBtn.setAttribute("aria-pressed", soundOn ? "true" : "false"); sndBtn.textContent = soundOn ? "เสียง เปิด" : "เสียง ปิด"; }
  sndBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem("dayzero.sound", soundOn ? "on" : "off"); } catch (e) {}
    paintSnd();
    if (soundOn) sfx.pick();
  });
  paintSnd();

  intro();
})();
</script>
</body>
</html>
